<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Blair - NekoVault</title>

<style>

@font-face {
    font-family: "Soul Billani";
    src: url("../SoulBillani.otf") format("opentype");
}

@font-face {
    font-family: "Prili Display";
    src: url("../PriliDisplay.otf") format("opentype");
}

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background-image:
        url("../images/background/background.jpg");

    background-size: cover;

    background-position: center;

    background-attachment: fixed;

    background-repeat: no-repeat;

    background-color: #1e5da5;

    font-family: Arial, sans-serif;
}

.page {

    width: 100%;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 30px 20px 50px;
}

.top-panel {

    width: min(1000px, 100%);

    background: #000000;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;

    padding: 15px 20px;

    border-radius: 25px;
}

.top-button {

    font-family:
        "Prili Display",
        serif;

    color: #FAEB92;

    text-decoration: none;

    font-size: 35px;

    padding: 8px 18px;

    text-shadow:
        0 0 5px #F582A7,
        0 0 10px #F582A7;
}

.top-button:hover {
    color: #F582A7;
}

.character-area {

    width: min(1100px, 100%);

    margin-top: 50px;
}

.character-panel {

    background: #000000;

    border-radius: 25px;

    padding: 30px;

    display: flex;

    gap: 40px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.7);
}

.character-image {

    width: 45%;

    max-height: 700px;

    object-fit: contain;

    border-radius: 18px;
}

.character-info {

    flex: 1;

    padding: 20px 10px;
}

.character-name {

    margin: 0;

    font-family:
        "Soul Billani",
        cursive;

    font-size: 65px;

    color: #FAEB92;

    text-shadow:
        0 0 8px #F582A7,
        0 0 16px #F582A7,
        3px 3px 0 #F582A7;
}

.character-series {

    margin-top: 15px;

    margin-bottom: 45px;

    font-family:
        "Prili Display",
        serif;

    font-size: 40px;
}

.series-link {

    color: #FAEB92;

    text-decoration: none;

    text-shadow:
        0 0 5px #F582A7,
        0 0 10px #F582A7;
}

.series-link:hover {
    color: #F582A7;
}

.character-detail {

    margin: 22px 0;

    font-family:
        "Prili Display",
        serif;

    font-size: 37px;

    color: #FAEB92;

    text-shadow:
        0 0 5px #F582A7,
        0 0 10px #F582A7;
}

.age {
    color: #FF0000;
}

.back-button {

    display: inline-block;

    margin-top: 35px;

    padding: 8px 18px;

    background: #FAEB92;

    color: #7b5e94;

    border-radius: 10px;

    font-family:
        "Prili Display",
        serif;

    font-size: 20px;

    text-decoration: none;
}

.back-button:hover {
    background: #F582A7;
}


@media (max-width: 700px) {

    .page {
        padding: 15px 10px 35px;
    }

    .top-panel {
        flex-wrap: wrap;
        gap: 3px;
        padding: 8px 6px;
    }

    .top-button {
        font-size: 21px;
        padding: 6px 9px;
    }

    .character-area {
        margin-top: 25px;
    }

    .character-panel {
        flex-direction: column;
        padding: 15px;
        gap: 18px;
    }

    .character-image {
        width: 100%;
        max-height: 500px;
    }

    .character-info {
        width: 100%;
        padding: 5px 3px;
    }

    .character-name {
        font-size: 42px;
    }

    .character-series {
        font-size: 25px;
        margin-bottom: 25px;
    }

    .character-detail {
        font-size: 24px;
        margin: 15px 0;
    }
}

@media (max-width: 400px) {

    .top-button {
        font-size: 18px;
    }

    .character-name {
        font-size: 35px;
    }

    .character-series {
        font-size: 21px;
    }

    .character-detail {
        font-size: 20px;
    }
}

</style>

</head>

<body>

<div class="page">

<nav class="top-panel">

<a href="/" class="top-button">
Home
</a>

<a href="/gallery" class="top-button">
Gallery
</a>

<a href="/characters" class="top-button">
Characters
</a>

<a href="/series-index.html" class="top-button">
Series
</a>

<a href="/profile" class="top-button">
Profile
</a>

</nav>

<main class="character-area">

<section class="character-panel">

<img
    src="blair.png"
    alt="Blair"
    class="character-image"
>

<div class="character-info">

<h1 class="character-name">
Blair
</h1>

<div class="character-series">

<a
    href="../series/soul-eater.html"
    class="series-link"
>
Soul Eater
</a>

</div>

<div class="character-detail">

Age:
<span class="age">
18+
</span>

</div>

<div class="character-detail">

Race:
Witch

</div>

<a
    href="../characters.html"
    class="back-button"
>
𐂯 Back to Characters
</a>

</div>

</section>

</main>

</div>

</body>

</html>
